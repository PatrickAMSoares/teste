[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photodedupe"
version = "1.0.0"
description = "PhotoDedupe - localiza e organiza fotos duplicadas em bibliotecas locais muito grandes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PhotoDedupe" }]
dependencies = [
    "PySide6>=6.6,<7",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
full = [
    "pillow-heif>=0.13",
    "opencv-python-headless>=4.8",
    "send2trash>=1.8",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]
dev = ["pytest>=7.4", "ruff>=0.4", "pyinstaller>=6.3"]

[project.gui-scripts]
photodedupe = "photodedupe.app:main"

[project.scripts]
photodedupe-cli = "photodedupe.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"photodedupe.resources" = ["*.qss", "*.svg", "*.ico", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
