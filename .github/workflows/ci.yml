name: Testes e pacote do Windows

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bibliotecas de sistema do Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Análise estática
        run: ruff check src tests tools packaging

      - name: Suíte de testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  precisao:
    name: Precisão da detecção (biblioteca sintética)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Gerar biblioteca de teste
        run: python tools/gerar_biblioteca.py --saida /tmp/biblioteca --originais 200 --pastas 8 --limpar

      - name: Medir recall, falsos positivos e segurança
        run: |
          python tools/benchmark.py --biblioteca /tmp/biblioteca --processos 2 --saida-json /tmp/bench.json
          python - <<'PY'
          import json, sys
          r = json.load(open("/tmp/bench.json"))
          falhas = []
          if r["recall_exatas"] < 100.0:
              falhas.append(f"recall de duplicatas exatas caiu para {r['recall_exatas']}%")
          if r["recall_visuais"] < 97.0:
              falhas.append(f"recall de duplicatas visuais caiu para {r['recall_visuais']}%")
          if r["falsos_positivos"] > 0:
              falhas.append(f"{r['falsos_positivos']} falsos positivos entre cenas distintas")
          if r["cenas_que_perderiam_todas_as_fotos"] > 0:
              falhas.append("há cenas que perderiam todas as fotos ao aplicar as recomendações")
          if r["rajadas_marcadas_para_remocao"] > 0:
              falhas.append(f"{r['rajadas_marcadas_para_remocao']} fotos de rajada marcadas para remoção")
          print(json.dumps(r, indent=2, ensure_ascii=False)[:2000])
          if falhas:
              sys.exit("FALHOU: " + "; ".join(falhas))
          print("Precisão dentro do esperado.")
          PY

  pacote-windows:
    name: Executável e instalador (Windows)
    runs-on: windows-latest
    needs: [testes]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar o executável
        run: pyinstaller packaging\photodedupe.spec --noconfirm --clean

      - name: Gerar o instalador (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: PhotoDedupe-windows
          path: |
            dist/instalador/*.exe
          if-no-files-found: error
